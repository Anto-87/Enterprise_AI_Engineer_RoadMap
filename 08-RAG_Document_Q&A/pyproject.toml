[project]
name = "ragdocqa"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Anto-87", email = "Antochris1987@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "faiss-cpu>=1.15.1",
    "ipykernel>=7.4.0",
    "langchain>=1.4.6",
    "langchain-classic>=1.0.8",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=3.0.0a1",
    "langchain-google-vertexai>=3.2.4",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.7.2",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.15",
    "pypdf>=6.20.1",
    "python-dotenv>=1.2.4",
    "streamlit>=1.66.0",
]

[project.scripts]
ragdocqa = "ragdocqa:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"
