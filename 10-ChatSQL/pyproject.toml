[project]
name = "10-chatsql"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Anto-87", email = "Antochris1987@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "arxiv>=4.0.2",
    "chromadb>=1.5.9",
    "ddgs>=9.16.1",
    "faiss-cpu>=1.15.1",
    "ipykernel>=7.4.0",
    "langchain>=1.4.7",
    "langchain-chroma>=1.1.0",
    "langchain-classic>=1.0.8",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=3.0.0a1",
    "langchain-google-vertexai>=3.2.5",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.3",
    "langchain-openai>=1.7.3",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.19",
    "pypdf>=6.21.4",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.2.0",
    "streamlit>=1.66.1",
    "wikipedia>=1.4.0",
]

[project.scripts]
